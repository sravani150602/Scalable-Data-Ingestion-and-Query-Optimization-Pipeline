<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0d1117"/><text x="60" y="65" fill="#f0f6fc" font-family="Arial" font-size="30" font-weight="700">Reproducible Performance Validation</text><text x="60" y="100" fill="#8b949e" font-family="Arial" font-size="17">The benchmark records measurements; it does not hard-code a successful result.</text>
  <g font-family="Arial" text-anchor="middle"><rect x="65" y="200" width="220" height="150" rx="14" fill="#161b22" stroke="#f85149" stroke-width="3"/><text x="175" y="245" fill="#f0f6fc" font-size="20" font-weight="700">Baseline</text><text x="175" y="280" fill="#ffb3ad" font-size="16">Drop indexes</text><text x="175" y="310" fill="#ffb3ad" font-size="16">Warm + repeat queries</text>
  <rect x="360" y="200" width="220" height="150" rx="14" fill="#161b22" stroke="#d29922" stroke-width="3"/><text x="470" y="245" fill="#f0f6fc" font-size="20" font-weight="700">Optimization</text><text x="470" y="280" fill="#ffe082" font-size="16">Create 6 indexes</text><text x="470" y="310" fill="#ffe082" font-size="16">Run ANALYZE</text>
  <rect x="655" y="200" width="220" height="150" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="3"/><text x="765" y="245" fill="#f0f6fc" font-size="20" font-weight="700">Measurement</text><text x="765" y="280" fill="#b7f7c2" font-size="16">Same 6 queries</text><text x="765" y="310" fill="#b7f7c2" font-size="16">Mean + p95 + plans</text>
  <rect x="950" y="200" width="190" height="150" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/><text x="1045" y="245" fill="#f0f6fc" font-size="20" font-weight="700">Evidence</text><text x="1045" y="280" fill="#b6dcff" font-size="16">JSON output</text><text x="1045" y="310" fill="#b6dcff" font-size="16">Reduction %</text></g>
  <g stroke="#8b949e" stroke-width="4"><line x1="285" y1="275" x2="360" y2="275"/><line x1="580" y1="275" x2="655" y2="275"/><line x1="875" y1="275" x2="950" y2="275"/></g>
  <rect x="180" y="430" width="840" height="80" rx="12" fill="#161b22" stroke="#30363d"/><text x="600" y="465" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="19" font-weight="700">Separate load test: 50K+ records · 6 configurations · 150 concurrent requests</text><text x="600" y="493" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="16">Observed response times → average, p95, maximum, throughput, and explicit PASS/FAIL</text>
</svg>
