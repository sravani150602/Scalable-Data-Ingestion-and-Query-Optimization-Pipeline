  <g font-family="Arial"><rect x="75" y="160" width="1050" height="58" rx="8" fill="#e7f5ff" stroke="#61affe"/><rect x="90" y="174" width="82" height="30" rx="5" fill="#61affe"/><text x="131" y="195" text-anchor="middle" fill="white" font-size="15" font-weight="700">POST</text><text x="195" y="196" fill="#24292f" font-size="18">/api/v1/records/</text><text x="515" y="196" fill="#57606a" font-size="16">Ingest one validated record</text>
  <rect x="75" y="235" width="1050" height="58" rx="8" fill="#e7f5ff" stroke="#61affe"/><rect x="90" y="249" width="82" height="30" rx="5" fill="#61affe"/><text x="131" y="270" text-anchor="middle" fill="white" font-size="15" font-weight="700">POST</text><text x="195" y="271" fill="#24292f" font-size="18">/api/v1/records/batch</text><text x="515" y="271" fill="#57606a" font-size="16">Batch ingest using one of six modes</text>
  <rect x="75" y="310" width="1050" height="58" rx="8" fill="#ecfdf3" stroke="#49cc90"/><rect x="90" y="324" width="82" height="30" rx="5" fill="#49cc90"/><text x="131" y="345" text-anchor="middle" fill="white" font-size="15" font-weight="700">GET</text><text x="195" y="346" fill="#24292f" font-size="18">/api/v1/records/</text><text x="515" y="346" fill="#57606a" font-size="16">Filter, order, and paginate records</text>
